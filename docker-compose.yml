services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: sar-dozor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - sar_dozor_pgdata:/var/lib/postgresql/data

volumes:
  sar_dozor_pgdata: